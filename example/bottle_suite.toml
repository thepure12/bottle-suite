cors = true
rest = true
sqlite = "example.db"
# Demo-only signing key. Regenerate before using this config for anything
# beyond this local example: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
jwt = "example-only-demo-key-do-not-reuse-3f9c2a7b"

[dashboard]
enabled = true
# No username/password_hash committed on purpose - visit /dashboard (or
# POST /dashboard/setup) on first run to choose your own admin credentials.
# See example/README.md.

[resources.projects.roles]
get = false
post = true
put = true
patch = true
delete = [ "admin",]

[resources.tasks.roles]
get = false
post = true
put = true
patch = true
delete = [ "admin",]

[resources.tags.roles]
get = false
post = true
delete = [ "admin",]

[resources.task_tags.roles]
get = false
post = true
delete = [ "admin",]

[resources.project_tasks]
paths = [ "/projects/<project_id>/tasks",]

[resources.project_summary]
paths = [ "/projects/<project_id>/summary",]
