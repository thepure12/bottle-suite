[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle_suite"
version = "0.0.17"
authors = [{ name = "TJ Renninger", email = "renninger12@gmail.com" }]
description = "bottle.py suite with CORS, SQL, REST, and JWT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "bottle",
  "PyJWT",
  "pymysql",
  "toml >= 0.10.2",
]

[project.scripts]
bottle-suite = "scripts.app:main"
bottle-suite-create = "scripts.create:main"
bottle-suite-resource = "scripts.create:resource"

[project.optional-dependencies]
test = [
  "coverage>=7.4",
  "webtest>=3.0",
]

[tool.coverage.run]
branch = true
include = [
  "*/bottle_suite/bottle_suite.py",
  "*/bottle_suite/resource_factory.py",
  "*/bottle_suite/resource_scaffold.py",
  "*/bottle_suite/resources.py",
  "*/bottle_suite/openapi.py",
  "*/bottle_suite/plugins/rest.py",
  "*/bottle_suite/plugins/jwt.py",
  "*/bottle_suite/plugins/sql.py",
  "*/bottle_suite/plugins/cors.py",
  "*/bottle_suite/dashboard/resources/token.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
]