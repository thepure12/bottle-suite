[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bottler"
version = "0.0.22"
authors = [{ name = "TJ Renninger", email = "renninger12@gmail.com" }]
description = "Scaffold and serve bottle.py apps with CORS, SQL, REST, JWT and an admin dashboard"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "bottle",
  "PyJWT",
  "pymysql",
  "toml >= 0.10.2",
  "importlib_metadata; python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/thepure12/bottle-suite"
Repository = "https://github.com/thepure12/bottle-suite"

[project.scripts]
bottler = "bottler.cli.app:main"
bottler-create = "bottler.cli.create:main"
bottler-resource = "bottler.cli.create:resource"

[project.optional-dependencies]
test = [
  "coverage>=7.4",
  "webtest>=3.0",
]

[tool.coverage.run]
branch = true
include = [
  "*/bottler/core.py",
  "*/bottler/wsgi.py",
  "*/bottler/resource_factory.py",
  "*/bottler/resource_scaffold.py",
  "*/bottler/resources.py",
  "*/bottler/openapi.py",
  "*/bottler/plugins/rest.py",
  "*/bottler/plugins/jwt.py",
  "*/bottler/plugins/sql.py",
  "*/bottler/plugins/cors.py",
  "*/bottler/dashboard/resources/token.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
]